[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbastars"
version = "0.2.0"
description = "NBA 历史球员多维排名系统 (时代修正 + 双视角排名 + 岭回归影响力)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "requests>=2.31",
    "streamlit>=1.30",
    "altair>=5.0",
    "matplotlib>=3.8",
    "nba_api>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
nbastars = "nbastars.run:main"

[tool.setuptools]
packages = ["nbastars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]